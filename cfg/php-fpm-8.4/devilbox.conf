; Active PHP-FPM overrides for the php84 container.
;
; The official php:8.4-fpm image ships none of the devilbox defaults, so the
; settings the rest of the stack takes for granted are re-established here.
; Loaded via `include=/etc/php-fpm-custom.d/*.conf` (see docker/php84/Dockerfile),
; which is processed after /usr/local/etc/php-fpm.d/*.conf — so these win.

[global]
log_level = notice

[www]
; Run workers as the devilbox user (uid/gid 1000) so files created by PHP match
; what ./shell.sh and the host see. The stock image would use www-data.
user = devilbox
group = devilbox

; Pass container env vars (DB creds etc.) through to PHP, like devilbox does.
clear_env = no

; Surface worker stdout/stderr in `docker logs` instead of swallowing it.
catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 120s
listen.backlog = 1024

pm = ondemand
pm.max_children = 50
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Logs land in log/php-fpm-8.4/ on the host.
; No slowlog: it needs ptrace(ATTACH), which containers lack without
; CAP_SYS_PTRACE, so it only produces "Operation not permitted" noise.
access.log = /var/log/php/php-fpm.access

