; Active php.ini overrides for the php84 container.
;
; The official php:8.4-fpm image ships no php.ini at all (only the unused
; php.ini-development / php.ini-production samples), so development defaults
; comparable to the devilbox images are set here.
; Loaded via PHP_INI_SCAN_DIR=":/etc/php-custom.d" (see docker/php84/Dockerfile).

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/php-fpm.error

date.timezone = UTC

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M

; Revalidate on every request so edited files take effect immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; vim: set ft=dosini:
